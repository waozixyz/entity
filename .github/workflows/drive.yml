name: Drive backup
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drive-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fake Drive transport and edition boundary
        run: python3 android/tests/test_adapter.py
  google-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
