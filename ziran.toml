[package]
name = "Self"
entry = "src/self.zi"
module_roots = ["src", "tests"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[exports]
model = "src/model.zi"
node_url = "src/node_url.zi"
management = "src/management.zi"
recovery = "src/recovery.zi"
native_files = "src/native_files.zi"
native_management = "src/native_management.zi"
pairing = "src/pairing.zi"
pairing_client = "src/pairing_client.zi"

[dependencies.qrcode]
git = "https://github.com/ziranlang/qrcode.git"
ref = "51fa84aedaa6ae4f6734e0fcca9bfc35a184d297"

[dependencies.daochi_client]
git = "https://github.com/ziranlang/daochi-client.git"
ref = "master"

[dependencies.monocypher]
git = "https://github.com/LoupVaillant/Monocypher.git"
ref = "e65d27722a43e9ed88da1987f3ad5675503c8cad"
source = true
